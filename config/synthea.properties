# Overrides on top of Synthea v4.0.0's built-in synthea.properties, passed with `-c`.
# Population, seeds, reference date, history window and state come from
# config/pipeline.yaml as command-line arguments, so they live in one place.

# FHIR R4 patient bundles only (US Core 6.1.0 profiles, Synthea's default).
exporter.fhir.export = true
exporter.fhir.transaction_bundle = true
exporter.fhir.bulk_data = false

# Hospital and practitioner bundles would feed care_site/provider, which are
# outside this CDM subset; skipping them keeps data/ smaller.
exporter.hospital.fhir.export = false
exporter.practitioner.fhir.export = false

# Every other exporter off. Synthea's own clinical notes are deliberately not
# used: Phase 4 generates notes with labelled phenomena (see ADR on notes).
exporter.csv.export = false
exporter.ccda.export = false
exporter.text.export = false
exporter.clinical_note.export = false

# Run metadata (seeds, version, timing) is written alongside the output.
exporter.metadata.export = true
