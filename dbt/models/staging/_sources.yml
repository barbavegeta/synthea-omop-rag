version: 2

sources:
  - name: raw
    description: FHIR resources as loaded by `rwe ingest` (one row per resource, JSONB payload).
    tables:
      - name: fhir_resource
      - name: fhir_bundle

  - name: notes
    description: Notes generated by `rwe notes` (Phase 4); exposed to the CDM as cdm.note.
    tables:
      - name: generated_note

  - name: vocab
    description: OHDSI vocabularies loaded by `rwe vocab` (Athena, or the CI stub).
    tables:
      - name: concept
      - name: concept_relationship
      - name: concept_ancestor
      - name: vocabulary
      - name: domain
      - name: concept_class
      - name: relationship
